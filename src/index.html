<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio id="bgm" autoplay muted loop playsinline preload="auto">
    <source src="assets/intro.mp3" type="audio/mpeg">
  </audio>

  <div id="lobby">
    <h1>Lobby</h1>
    <button id="startBtn" type="button">
<svg class="btnText" viewBox="0 0 900 180" aria-label="Do you wish to enter?">

  <defs>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shell -->
  <rect x="8" y="8" width="884" height="164"
        fill="none"
        stroke="#0b2f57"
        stroke-width="2.5"
        filter="url(#softGlow)"/>

  <rect x="16" y="16" width="868" height="148"
        fill="none"
        stroke="#06203d"
        stroke-width="1.2"/>

  <rect x="24" y="24" width="852" height="132"
        fill="none"
        stroke="#123d68"
        stroke-width="0.8"/>

  <!-- Main inner panel -->
  <rect x="90" y="38" width="720" height="104"
        fill="none"
        stroke="#14395d"
        stroke-width="1.5"/>

  <rect x="102" y="48" width="696" height="84"
        fill="none"
        stroke="#0a2038"
        stroke-width="0.8"/>

  <!-- Top central cathedral crown -->
  <path d="M430 24 L440 8 L450 24 L460 8 L470 24"
        fill="none"
        stroke="#3db7ff"
        stroke-width="1.3"
        filter="url(#blueGlow)"/>

  <path d="M418 30 L430 24 L442 30 L450 18 L458 30 L470 24 L482 30"
        fill="none"
        stroke="#1e6fab"
        stroke-width="1"/>

  <!-- Bottom central inverted ornament -->
  <path d="M430 156 L440 172 L450 156 L460 172 L470 156"
        fill="none"
        stroke="#3db7ff"
        stroke-width="1.3"
        filter="url(#blueGlow)"/>

  <path d="M418 150 L430 156 L442 150 L450 162 L458 150 L470 156 L482 150"
        fill="none"
        stroke="#1e6fab"
        stroke-width="1"/>

  <!-- Left shrine frame -->
  <path d="M42 40
           L70 40
           L82 28
           L94 40
           L94 140
           L82 152
           L70 140
           L42 140
           Z"
        fill="none"
        stroke="#123d68"
        stroke-width="1.4"/>

  <!-- Right shrine frame -->
  <path d="M858 40
           L830 40
           L818 28
           L806 40
           L806 140
           L818 152
           L830 140
           L858 140
           Z"
        fill="none"
        stroke="#123d68"
        stroke-width="1.4"/>

  <!-- Left inner sigil -->
  <circle cx="68" cy="90" r="20"
          fill="none"
          stroke="#0a2038"
          stroke-width="1"/>
  <circle cx="68" cy="90" r="11"
          fill="none"
          stroke="#33a9ff"
          stroke-width="1"
          filter="url(#blueGlow)"/>
  <path d="M68 70 L68 110 M48 90 L88 90 M55 77 L81 103 M81 77 L55 103"
        fill="none"
        stroke="#1d6ea6"
        stroke-width="0.9"/>

  <!-- Right inner sigil -->
  <circle cx="832" cy="90" r="20"
          fill="none"
          stroke="#0a2038"
          stroke-width="1"/>
  <circle cx="832" cy="90" r="11"
          fill="none"
          stroke="#33a9ff"
          stroke-width="1"
          filter="url(#blueGlow)"/>
  <path d="M832 70 L832 110 M812 90 L852 90 M819 77 L845 103 M845 77 L819 103"
        fill="none"
        stroke="#1d6ea6"
        stroke-width="0.9"/>

  <!-- Corner tracery -->
  <path d="M32 32 L58 32 L32 58 M40 32 Q56 48 40 64"
        fill="none"
        stroke="#39b4ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <path d="M868 32 L842 32 L868 58 M860 32 Q844 48 860 64"
        fill="none"
        stroke="#39b4ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <path d="M32 148 L58 148 L32 122 M40 148 Q56 132 40 116"
        fill="none"
        stroke="#39b4ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <path d="M868 148 L842 148 L868 122 M860 148 Q844 132 860 116"
        fill="none"
        stroke="#39b4ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <!-- Side arch tracery -->
  <path d="M130 38
           Q150 12 170 38
           Q150 64 130 38"
        fill="none"
        stroke="#173b62"
        stroke-width="1"/>

  <path d="M770 38
           Q750 12 730 38
           Q750 64 770 38"
        fill="none"
        stroke="#173b62"
        stroke-width="1"/>

  <path d="M130 142
           Q150 168 170 142
           Q150 116 130 142"
        fill="none"
        stroke="#173b62"
        stroke-width="1"/>

  <path d="M770 142
           Q750 168 730 142
           Q750 116 770 142"
        fill="none"
        stroke="#173b62"
        stroke-width="1"/>

  <!-- Vertical dividers -->
  <line x1="180" y1="38" x2="180" y2="142" stroke="#0a2038" stroke-width="1"/>
  <line x1="720" y1="38" x2="720" y2="142" stroke="#0a2038" stroke-width="1"/>

  <line x1="210" y1="50" x2="210" y2="130" stroke="#081728" stroke-width="0.8"/>
  <line x1="690" y1="50" x2="690" y2="130" stroke="#081728" stroke-width="0.8"/>

  <!-- Horizontal rune rails -->
  <line x1="110" y1="60" x2="790" y2="60" stroke="#081728" stroke-width="0.9"/>
  <line x1="110" y1="120" x2="790" y2="120" stroke="#081728" stroke-width="0.9"/>

  <!-- Midpoint ornaments on rails -->
  <path d="M250 60 L260 52 L270 60 L280 52 L290 60"
        fill="none"
        stroke="#17466f"
        stroke-width="0.9"/>
  <path d="M610 60 L620 52 L630 60 L640 52 L650 60"
        fill="none"
        stroke="#17466f"
        stroke-width="0.9"/>

  <path d="M250 120 L260 128 L270 120 L280 128 L290 120"
        fill="none"
        stroke="#17466f"
        stroke-width="0.9"/>
  <path d="M610 120 L620 128 L630 120 L640 128 L650 120"
        fill="none"
        stroke="#17466f"
        stroke-width="0.9"/>

  <!-- Central ornamental lozenge -->
  <path d="M450 46
           L468 64
           L450 82
           L432 64
           Z"
        fill="none"
        stroke="#2eb2ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <path d="M450 98
           L468 116
           L450 134
           L432 116
           Z"
        fill="none"
        stroke="#2eb2ff"
        stroke-width="1.1"
        filter="url(#blueGlow)"/>

  <!-- Center axis line -->
  <line x1="450" y1="30" x2="450" y2="150"
        stroke="#0f2e4a"
        stroke-width="0.8"/>

  <!-- Small internal filigree -->
  <path d="M355 90
           Q380 70 405 90
           Q380 110 355 90"
        fill="none"
        stroke="#14395d"
        stroke-width="0.9"/>

  <path d="M545 90
           Q520 70 495 90
           Q520 110 545 90"
        fill="none"
        stroke="#14395d"
        stroke-width="0.9"/>

  <!-- Tiny ticks -->
  <line x1="300" y1="38" x2="300" y2="50" stroke="#1f5c8f" stroke-width="0.8"/>
  <line x1="600" y1="38" x2="600" y2="50" stroke="#1f5c8f" stroke-width="0.8"/>
  <line x1="300" y1="130" x2="300" y2="142" stroke="#1f5c8f" stroke-width="0.8"/>
  <line x1="600" y1="130" x2="600" y2="142" stroke="#1f5c8f" stroke-width="0.8"/>

  <!-- Text -->
  <text x="50%" y="50%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="Cardo, serif"
        font-size="34"
        letter-spacing="2.2"
        fill="#7fd3ff"
        style="
          filter:
            drop-shadow(0 0 4px #4bc0ff)
            drop-shadow(0 0 10px #1d86d1)
            drop-shadow(0 0 18px #0a345d);
        ">
    Do you wish to enter?
  </text>

</svg>
    </button>
  </div>

  <script>
      const bgm = document.getElementById("bgm");
      bgm.muted = false;
      bgm.play().catch(() => {});

      document.getElementById("startBtn").addEventListener("click", () => {
        window.location.href = "page1.html";
      });
  </script>
</body>
</html>
